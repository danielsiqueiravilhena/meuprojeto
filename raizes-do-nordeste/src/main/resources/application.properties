spring.application.name=raizes-do-nordeste


# =====================================================
# BANCO DE DADOS POSTGRESQL
# =====================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raizes_nordeste}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}


# =====================================================
# SERVIDOR
# =====================================================

server.port=8081


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/raizes_nordeste}

spring.flyway.user=${DB_USERNAME:postgres}

spring.flyway.password=${DB_PASSWORD}

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

spring.flyway.baseline-version=1


# =====================================================
# JWT
# =====================================================

JWT_SECRET=${JWT_SECRET}